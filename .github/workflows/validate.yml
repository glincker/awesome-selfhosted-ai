name: Validate

on:
  pull_request:
    paths: ['data/projects.json']

env:
  MIN_STARS: 500
  RISING_MIN_STARS: 100
  RISING_MAX_AGE_DAYS: 365

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate schema and new repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="origin/${{ github.base_ref }}"
          new=$(git diff "$base"...HEAD -U0 data/projects.json | grep -E '^\+\s+"repo"' | sed -E 's/.*"repo": *"([^"]+)".*/\1/' | paste -sd, -)
          CHECK_REPOS="$new" node scripts/validate.mjs
